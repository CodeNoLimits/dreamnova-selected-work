<style>
:root{--or:#ecc46a;--orc:#f7e3b0;--txt:#d9cfbd;--bas:#8d8069}
*{box-sizing:border-box;margin:0}
body{background:#050403;color:var(--txt);font:400 17px/1.6 "Avenir Next",Avenir,Futura,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1180px;margin:0 auto;padding:clamp(40px,7vw,96px) 20px 80px}

<h1>Noir et or.</h1>
<p class="intro">Un visualizer du studio, dans deux formats. Chaque barre suit le son : la basse ouvre le halo, les aigus tirent les pointes. Ton titre, ton nom et ta pochette prennent la place du centre.</p>
<div class="grille">
<figure><video controls playsinline preload="metadata" poster="affiche_verticale.jpg" src="visualizer_vertical.mp4"></video><figcaption><b>Vertical</b>Reels, TikTok, Shorts et statut. 14 secondes.</figcaption></figure>
<figure><video controls playsinline preload="metadata" poster="affiche.jpg" src="visualizer_horizontal.mp4"></video><figcaption><b>Horizontal</b>YouTube. 14 secondes.</figcaption></figure>
</div>
<footer>Démonstration de DreamNova Studio. La musique est une composition originale du studio.</footer>
